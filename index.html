<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RogueHashrate</title>
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="star-1"></div>
  <div class="star-2"></div>
  <div class="star-3"></div>
  <div class="star-4"></div>
  <div class="star-5"></div>
  <div class="star-6"></div>
  <div class="star-7"></div>
  <div class="star-8"></div>
  <div class="container">
    <img src="assets/roguehashrate.png" alt="roguehashrate-pfp" class="pfp">
    
    <h1>RogueHashrate</h1>
    
    <p class="npub-label">find me on nostr <img src="assets/nostr-icon-white-transparent.svg" alt="nostr" class="nostr-icon"></p>

    <div class="npub-wrap">
      <a href="https://ditto.pub/follow/npub1hs5244d3vle3m5muvmvvjh2qp3jprkpjwhk393gy7cykt50eamrq8f5rx4" class="npub" target="_blank" rel="noopener" title="open profile on ditto.pub">
        <span class="npub-full">npub1hs5244d3vle3m5muvmvvjh2qp3jprkpjwhk393gy7cykt50eamrq8f5rx4</span>
      </a>
      <button type="button" class="npub-copy" id="npub-copy" aria-label="copy npub" title="copy npub">
        <svg class="npub-copy-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </button>
      <span class="npub-copied">copied!</span>
    </div>
    
    <div class="links">
      <a href="https://jumble.roguehashrate.com" class="link">RogueJumble</a>
      <a href="https://4otsmfvlhe6281dq29zvswb1kfn1w2xn24ud14lus11ctx522ucrownfall.nsite.run/" class="link">Crownfall</a>
      <a href="https://regicide.roguehashrate.com" class="link">Regicide</a>
      <a href="https://pewpew.roguehashrate.com" class="link">PewPew</a>
    </div>

   <div class="links">
    <a href="https://github.com/roguehashrate" class="link" target="_blank">GitHub</a>
  </div>

  <script>
    const npubCopy = document.getElementById('npub-copy');
    const npubCopied = document.querySelector('.npub-copied');
    npubCopy.addEventListener('click', async () => {
      await navigator.clipboard.writeText(document.querySelector('.npub-full').textContent);
      npubCopied.classList.add('show');
      setTimeout(() => npubCopied.classList.remove('show'), 1500);
    });
  </script>
  </div>
</body>
</html>
