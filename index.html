<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RogueHashrate — find me on Nostr, GitHub, and my projects.">
  <title>RogueHashrate</title>
  <link rel="stylesheet" href="style.css?v=6">
  <link rel="icon" href="favicon.ico" />
</head>
<body>
  <div class="star-1"></div>
  <div class="star-2"></div>
  <div class="star-3"></div>
  <div class="star-4"></div>
  <div class="star-5"></div>
  <div class="star-6"></div>
  <div class="star-7"></div>
  <div class="star-8"></div>
  <div class="container">
    <img src="assets/roguehashrate.png" alt="roguehashrate-pfp" class="pfp">
    
    <h1>RogueHashrate</h1>
    
    <p class="npub-label">find me on nostr <img src="assets/nostr-icon-white-transparent.svg" alt="nostr" class="nostr-icon"></p>

    <div class="npub-wrap">
      <a href="https://ditto.pub/follow/npub1hs5244d3vle3m5muvmvvjh2qp3jprkpjwhk393gy7cykt50eamrq8f5rx4" class="npub" target="_blank" rel="noopener" title="open profile on ditto.pub">
        <span class="npub-full">npub1hs5244d3vle3m5muvmvvjh2qp3jprkpjwhk393gy7cykt50eamrq8f5rx4</span>
      </a>
      <button type="button" class="npub-copy" id="npub-copy" aria-label="copy npub" title="copy npub">
        <svg class="npub-copy-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </button>
      <span class="npub-copied">copied!</span>
    </div>
    
    <nav class="links" aria-label="projects">
      <a href="https://jumble.roguehashrate.com" class="link">
        <span class="link-name">RogueJumble</span>
        <span class="link-desc">a fork of the Nostr client Jumble</span>
      </a>
      <a href="https://4otsmfvlhe6281dq29zvswb1kfn1w2xn24ud14lus11ctx522ucrownfall.nsite.run/" class="link">
        <span class="link-name">Crownfall</span>
        <span class="link-desc">card game</span>
      </a>
      <a href="https://regicide.roguehashrate.com" class="link">
        <span class="link-name">Regicide</span>
        <span class="link-desc">card game</span>
      </a>
      <a href="https://pewpew.roguehashrate.com" class="link">
        <span class="link-name">PewPew</span>
        <span class="link-desc">arcade-style shooter</span>
      </a>
      <a href="https://github.com/roguehashrate" class="link" target="_blank">
        <span class="link-name">GitHub</span>
      </a>
    </nav>

  <script>
    const PUBKEY = 'bc28aad5b167f31dd37c66d8c95d400c6411d83275ed12c504f60965d1f9eec6';

    // npub copy button
    const npubCopy = document.getElementById('npub-copy');
    const npubCopied = document.querySelector('.npub-copied');
    npubCopy.addEventListener('click', async () => {
      await navigator.clipboard.writeText(document.querySelector('.npub-full').textContent);
      npubCopied.classList.add('show');
      setTimeout(() => npubCopied.classList.remove('show'), 1500);
    });

    // sync profile picture and theme from Nostr relay
    (function() {
      const pfp = document.querySelector('.pfp');
      let gotProfile = false, gotTheme = false;

      function done() {
        if (gotProfile && gotTheme) ws.close();
      }

      const ws = new WebSocket('wss://relay.ditto.pub/');
      ws.onopen = () => {
        ws.send(JSON.stringify(['REQ', 'profile', { kinds: [0], authors: [PUBKEY], limit: 1 }]));
        ws.send(JSON.stringify(['REQ', 'theme', { kinds: [16767], authors: [PUBKEY], limit: 1 }]));
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg[0] !== 'EVENT') return;
        const ev = msg[2];

        if (ev.kind === 0) {
          try {
            const meta = JSON.parse(ev.content);
            if (meta.picture) pfp.src = meta.picture;
          } catch {}
          gotProfile = true;
          done();
        }

        if (ev.kind === 16767) {
          const colors = {};
          for (const tag of ev.tags) {
            if (tag[0] === 'c' && tag[2]) colors[tag[2]] = tag[1];
          }
          const root = document.documentElement.style;
          if (colors.background) root.setProperty('--bg', colors.background);
          if (colors.text) root.setProperty('--text', colors.text);
          if (colors.primary) root.setProperty('--primary', colors.primary);
          gotTheme = true;
          done();
        }
      };

      ws.onerror = () => ws.close();
      setTimeout(() => { if (ws.readyState < 2) ws.close(); }, 5000);
    })();
  </script>
  </div>
</body>
</html>
